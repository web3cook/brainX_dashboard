services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: brainx
      POSTGRES_USER: brainx
      POSTGRES_PASSWORD: brainx_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainx -d brainx"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Live-reload the backend app...
      - ./backend:/app
      # ...and layer agents/ back in at /app/agents (baked at build time by
      # the Dockerfile too, but bind-mounting it here means edits to either
      # package are picked up without a rebuild).
      - ./agents:/app/agents
      - agent_state:/var/lib/brainx/checkpoints
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://brainx:brainx_dev@db:5432/brainx
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGIN: http://localhost:3000
      CHECKPOINT_DIR: /var/lib/brainx/checkpoints
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the container's own installs win over whatever
      # (or nothing) is bind-mounted from the host at the same paths.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      # Browser-facing, the user's browser talks to the api container via
      # its host-mapped port, not the Docker network, so this stays
      # localhost even though both services run in Compose.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  agent_state:
